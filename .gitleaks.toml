# The gitleaks config below exists because of this directory. Read this first.
#
# `localhost-key.pem` is a private key, so gitleaks' `private-key` rule flags it
# — correctly, on a file that is a private key. It is allowlisted by path rather
# than by fingerprint, because a fingerprint embeds the commit SHA and goes stale
# the moment the file changes; a path does not.
#
# The scope is one file. Every other rule in gitleaks' default config still
# applies, including to this directory: a real credential pasted into any other
# fixture is still caught. This does not disable the scan, and it was added only
# after the scan was fixed enough to run at all (see the note in ci.yml about the
# `linux_amd64` → `linux_x64` asset rename that had silently broken the job).
[extend]
useDefault = true

[allowlist]
description = "Self-signed localhost test key — see tests/fixtures/README.md"
paths = ['''tests/fixtures/localhost-key\.pem''']