name: Stale Issue & PR Manager

on:
  schedule:
    - cron: "0 8 * * 1-5" # Weekdays at 08:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          # Issues
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this is still relevant, please leave a comment to keep it open.
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
            Please feel free to reopen if the issue is still relevant.
          stale-issue-label: "stale"
          exempt-issue-labels: "never-stale,bug,security,regression,roadmap"

          # Pull Requests
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not
            had recent activity. It will be closed in 14 days if no further activity occurs.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Please feel free to reopen if you plan to continue working on it.
          stale-pr-label: "stale"
          exempt-pr-labels: "never-stale,dependencies,security"

          # Schedule
          days-before-stale: 60
          days-before-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14

          # Limits
          operations-per-run: 100
          ascending: true

          # Label management
          remove-stale-when-updated: true
          delete-branch: true
